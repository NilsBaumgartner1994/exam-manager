# Data-Clumps-Analyse: sucht wiederkehrende Gruppen gleicher Felder/Parameter
# (Data Clumps) im TypeScript-Code und legt Report und Badge unter `reports/`
# ab. Läuft bei jedem Push auf main und lässt sich von Hand anstoßen.
#
# Der Report wird zurück nach main committet, damit das Badge in der README
# immer den aktuellen Stand zeigt. Pushes mit dem GITHUB_TOKEN lösen keine
# weiteren Workflows aus – dieser Commit startet den Workflow also nicht erneut.
name: "🩺 Data Clumps"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      start-directory:
        description: "Startverzeichnis der Analyse"
        required: false
        default: "."
      amount:
        description: "Anzahl der Data Clumps im Issue-Text"
        required: false
        default: "5"
      force:
        description: "Badge und Issue auch ohne Änderung erneuern"
        required: false
        default: "false"

# Zwei gleichzeitige Läufe würden sich beim Zurückschreiben in die Quere kommen.
concurrency:
  group: data-clumps-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  data-clumps:
    name: "🩺 Data Clumps analysieren"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: "🔄 Repository auschecken"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🩺 Data Clumps analysieren"
        id: data-clumps
        uses: NilsBaumgartner1994/data-clumps-doctor/.github/actions/analyse-data-clumps@master
        with:
          path-to-source: ${{ github.event.inputs.start-directory || '.' }}
          output-path: reports/data-clumps-doctor/data-clumps.json
          badge-output-path: reports/data-clumps-doctor/badges/data-clumps.svg
          source-language-type: typescript
          generate-issue: 'true'
          # Bei jedem Push neu zu schreiben und ein Issue zu öffnen wäre Lärm:
          # Badge und Issue ändern sich nur, wenn sich die Data Clumps ändern.
          only-update-if-changes: ${{ github.event.inputs.force == 'true' && 'false' || 'true' }}
          refactor-amount: ${{ github.event.inputs.amount || '5' }}
          # sampleData.ts ist generiert (tools/sync_sample_data_to_app.py).
          detector-options-paths-ignored-in-detection-comparison: '**/sampleData.ts'

      - name: "💾 Report zurückschreiben"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` zuerst: So zählen auch neue Dateien (Badge-Ordner) als Änderung.
          git add reports/data-clumps-doctor
          if git diff --cached --quiet; then
            echo "::notice::Report unverändert – nichts zu committen."
            exit 0
          fi
          git commit -m "chore: Data-Clumps-Report aktualisieren (${{ steps.data-clumps.outputs.data-clumps-count }} Data Clumps)"
          # Zwischenzeitliche Commits anderer nicht überschreiben.
          for versuch in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch ${versuch}) – neuer Versuch."
            sleep $((versuch * 5))
          done
          exit 1

      - name: "📊 Zusammenfassung"
        run: |
          echo "### 🩺 Data Clumps" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gefunden: **${{ steps.data-clumps.outputs.data-clumps-count }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: \`reports/data-clumps-doctor/data-clumps.json\`" >> "$GITHUB_STEP_SUMMARY"
