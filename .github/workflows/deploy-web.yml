# Baut die Expo-Web-App und veröffentlicht sie auf GitHub Pages.
# Voraussetzung: In den Repo-Einstellungen unter Pages "GitHub Actions" als Source wählen.
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Abhängigkeiten installieren
        run: yarn install --frozen-lockfile

      - name: Tests (Fachlogik)
        run: yarn workspace @exam-manager/core test

      - name: Typecheck
        run: yarn typecheck

      - name: Web-Export (mit GitHub-Pages-Basispfad)
        working-directory: apps/web
        env:
          # Muss dem Repo-Namen entsprechen: https://<user>.github.io/exam-manager/
          EXPO_BASE_URL: /exam-manager
        run: npx expo export --platform web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
