# Jest-Tests (Fachlogik und Kommandozeile) und Typecheck: bei jedem Pull Request und bei jedem
# Push – auch auf `main`, damit der Status von main jederzeit sichtbar ist
# (Banner in der README).
name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn typecheck
