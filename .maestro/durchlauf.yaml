# Kompletter Durchlauf: alle fünf Screens mit den eingebauten Beispieldaten.
# Erwartete Zahlen stammen aus dem anonymisierten Beispiel-Datensatz
# (siehe README "Beispieldaten"): 6 neue Zulassungen, 9 mit Zulassung,
# 7 von 8 Angemeldeten zugelassen, 7 Sitzplätze in 5 Räumen.
url: http://localhost:8081
---
# ---------- Startseite ----------
- launchApp
# Erster Aufruf: Metro bundelt on demand – großzügig warten
- extendedWaitUntil:
    visible: 'Exam Manager'
    timeout: 60000
- assertVisible: '1. VIPS-Punkte auswerten'

# ---------- Screen 1: VIPS-Punkte auswerten ----------
- tapOn: '1. VIPS-Punkte auswerten'
- assertVisible: 'Beispieldaten laden'
- tapOn: 'Beispieldaten laden'
- assertVisible: 'Beispieldaten geladen.'
- scrollUntilVisible:
    element: 'Auswerten'
- tapOn: 'Auswerten'
- scrollUntilVisible:
    element: '6 Studierende haben die Zulassung neu erworben.'
- assertVisible: '6 Studierende haben die Zulassung neu erworben.'
- scrollUntilVisible:
    element: 'Schrödinger'   # Umlaute überleben die UTF-8-Kette
- scrollUntilVisible:
    element: 'CSV herunterladen'
- scrollUntilVisible:
    element: 'Zugelassene Studierende in den Zulassungen-Ordner ablegen'
- scrollUntilVisible:
    element: 'Aktuelles Projekt herunterladen'
# Der Weiter-Knopf führt auf Screen 2 – ab hier läuft der Flow dort weiter.
- scrollUntilVisible:
    element: 'Weiter zu 2. Zulassung prüfen & PDF generieren'
- tapOn: 'Weiter zu 2. Zulassung prüfen & PDF generieren'
- assertVisible: '2. Zulassung prüfen & PDF generieren'

# ---------- Screen 2: Zulassung prüfen & PDF generieren ----------
- launchApp
- tapOn: '2. Zulassung prüfen & PDF generieren'
- tapOn: 'Beispieldaten laden'
- assertVisible: 'Beispieldaten geladen.'
# Suche im Bestand: Pascal steht in der Liste von 2024, nicht in der von 2025.
- tapOn: 'Name oder Matrikelnummer'
- inputText: 'Pascal'
- assertVisible: 'swe++24_zulassungen.csv'
# Der Text der Schreiben ist eine Vorlage: Blatt öffnen, Vorschau prüfen,
# wieder schließen – erzeugt wird danach mit dem unveränderten Standardtext.
- scrollUntilVisible:
    element: 'Text anpassen'
- tapOn: 'Text anpassen'
- assertVisible: 'Text der Zulassungs-PDFs'
- assertVisible: '<Matrikelnummer>'
- tapOn: 'Schließen'
- scrollUntilVisible:
    element: 'PDFs erzeugen'
- tapOn: 'PDFs erzeugen'
- extendedWaitUntil:
    visible: '9 Zulassungs-PDFs erzeugt.'
    timeout: 20000
- scrollUntilVisible:
    element: 'ZIP herunterladen'

# ---------- Screen 3: Klausur-Anmeldungen prüfen ----------
- launchApp
- tapOn: '3. Klausur-Anmeldungen prüfen'
- tapOn: 'Beispieldaten laden'
- extendedWaitUntil:
    visible: 'Beispieldaten geladen.'
    timeout: 10000
- scrollUntilVisible:
    element: 'Zulassungen prüfen'
- tapOn: 'Zulassungen prüfen'
- scrollUntilVisible:
    element: '7 von 8 Angemeldeten sind zugelassen.'
- assertVisible: '7 von 8 Angemeldeten sind zugelassen.'
- scrollUntilVisible:
    element: 'Crick'         # die eine Person ohne Zulassung
- assertVisible: 'Nicht zugelassen: Crick, Francis (1000006)'

# ---------- Screen 4: Raumzuteilung & Sitzplan ----------
# Arbeitsfläche wie eine Tabellenkalkulation: oben die Menüleiste (Datei, PDF,
# Werkzeuge, Anzeigen, Räume), dazwischen die Fläche, unten die Fußleiste.
# Jede Aktion steht in einem Menü – erst den Namen antippen, dann den Eintrag.
- launchApp
- tapOn: '4. Raumzuteilung & Sitzplan'
- tapOn:
    id: 'raum-menue-datei'
- tapOn: 'Beispieldaten laden'
# Welche Räume die Klausur benutzt, steht im Reiter „Einstellungen“ – aus dem
# Bestand in Raeume/ ausgewählt; derselbe Raum darf mehrfach dabei sein.
- assertVisible: 'Räume der Klausur'
- scrollUntilVisible:
    element: 'Zuteilung erstellen'
- tapOn: 'Zuteilung erstellen'
# Danach steht das Ergebnis im Reiter „Listen“.
- assertVisible: '7 Sitzplätze in 5 Räumen vergeben'
- tapOn: 'Dozent'
- tapOn: 'Tutor'
- tapOn:
    id: 'raum-ansicht-raeume'
- tapOn: 'Aushang'
# Ein Reiter je Raumeinsatz – zu finden im Menü „Räume“. Der Sitzplan füllt
# danach die Fläche, Zoom und Stand stehen darunter.
- tapOn:
    id: 'raum-menue-raeume'
- tapOn:
    id: 'raum-reiter-94/E01'
- assertVisible: 'Raster 9 Spalten'
# Was in den Kästen steht, hängt im Menü „Anzeigen“ – ein Häkchen lässt es
# offen, deshalb schließt der zweite Tipp auf den Namen es wieder.
- tapOn:
    id: 'raum-menue-anzeige'
- assertVisible: 'Namenskürzel'
- tapOn:
    id: 'raum-menue-anzeige'
# Die Palette liegt im Menü „Werkzeuge“ – erst der Modus, dann die Elemente.
- tapOn:
    id: 'raum-menue-werkzeuge'
- tapOn: 'Raum bearbeiten'
- tapOn:
    id: 'raum-menue-werkzeuge'
- assertVisible: 'Sitzplatz'
- tapOn:
    id: 'raum-menue-werkzeuge'
# Der Text der Sitzplatz-PDFs ist eine Vorlage: Blatt öffnen, Vorschau mit den
# Daten der ersten Person prüfen, wieder schließen.
- tapOn:
    id: 'raum-menue-pdf'
- tapOn: 'Text der PDFs anpassen'
- assertVisible: 'Text der Sitzplatz-PDFs'
- assertVisible: '<Sitzplatznummer>'
- tapOn: 'Schließen'

# ---------- Screen 5: Räume & Raumpläne ----------
# Derselbe Aufbau wie Schritt 4: Menüleiste (Datei, Werkzeuge, Räume), Plan,
# Fußleiste. Räume ohne Teilnehmende bearbeiten.
- launchApp
- tapOn: '5. Räume & Raumpläne'
- tapOn:
    id: 'raeume-menue-datei'
- tapOn: 'Beispieldaten laden'
- assertVisible: 'Bestand des Hauses'
# Die Raumliste ist der Bestand: je Raum sein Raster – und von dort aus zu öffnen.
- scrollUntilVisible:
    element:
      id: 'raeume-plan-94/E01'
- assertVisible: '28 Sitzplätze im Raster'
- tapOn:
    id: 'raeume-plan-94/E01'
- assertVisible: 'Raster 9 Spalten'
- tapOn:
    id: 'raeume-menue-raeume'
- tapOn:
    id: 'raeume-reiter-liste'
# Bearbeitet wird ein Raum nach dem anderen – die Räume stehen im Menü „Räume“.
- tapOn:
    id: 'raeume-menue-raeume'
- tapOn:
    id: 'raeume-waehlen-66/E33'
- assertVisible: 'Raster 19 Spalten'
# Die Palette liegt im Menü „Werkzeuge“; der zweite Tipp schließt es wieder.
- tapOn:
    id: 'raeume-menue-werkzeuge'
- assertVisible: 'Sitzplatz'
- tapOn:
    id: 'raeume-menue-werkzeuge'
# Der Grundriss als PDF – dieselbe Zeichnung wie der Sitzplan in Schritt 4,
# nur ohne Belegung, und je Raum eine Datei.
- tapOn:
    id: 'raeume-menue-datei'
- tapOn: 'Raumplan als PDF'
- extendedWaitUntil:
    visible: 'Raumplan 66/E33 als PDF gespeichert.'
    timeout: 20000
- tapOn:
    id: 'raeume-menue-datei'
- tapOn: 'Räume als CSV speichern'
- assertVisible: 'Raumliste heruntergeladen'
- tapOn:
    id: 'raeume-menue-datei'
- tapOn: 'Raster als CSV speichern'
# Je Raum eine Datei, benannt nach dem Raum (01_E01.csv, 66_E33.csv, ...).
- assertVisible: 'Raster heruntergeladen'
# Bestand pflegen: Ein neuer Raum entsteht mit Namen und Vorschlagsraster.
- tapOn:
    id: 'raeume-menue-raeume'
- tapOn:
    id: 'raeume-neu'
- tapOn:
    id: 'raeume-vorgang-name'
- inputText: '99/A01'
- tapOn:
    id: 'raeume-vorgang-ok'
- assertVisible: 'Raum 99/A01 angelegt'
# Umbenennen zieht das Raster mit – der Raum heißt danach überall anders.
- tapOn:
    id: 'raeume-menue-raeume'
- tapOn:
    id: 'raeume-umbenennen'
- tapOn:
    id: 'raeume-vorgang-name'
- eraseText
- inputText: '99/A02'
- tapOn:
    id: 'raeume-vorgang-ok'
- assertVisible: '99/A01 heißt jetzt 99/A02'
